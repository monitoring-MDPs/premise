[project]
name = "premise"
version = "0.3.0"
description = "Monitoring Systems with Imprecise Sensors"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Junges", email = "sebastian.junges@ru.nl" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.1",
    "stormpy>=2.0.0",
    "tqdm",
]

[project.urls]
Repository = "https://github.com/monitoring-MDPs/premise"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["premise"]

[tool.uv.sources]
gridstorm = { git = "https://github.com/lukovdm/gridworld-by-storm", branch = "master" }

[dependency-groups]
viz = [
    "gridstorm",
]

